[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "context-forge"
version = "0.12.0"
description = "forge — an evidence-to-asset, review-gated context compiler for multi-runtime agent context."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "dxy", email = "peter.dong@gmail.com" }]
keywords = ["agent", "context", "compiler", "llm", "claude", "review-gated"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "pyyaml>=6.0",
    "click>=8.1",
    "textual>=0.50",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov"]

[project.scripts]
forge = "forge.cli:main"

[tool.setuptools.packages.find]
include = ["forge*"]
exclude = ["tests*", "examples*"]

[tool.setuptools.package-data]
forge = ["assets/skills/forge/SKILL.md"]
